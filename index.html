<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rain — 雨声 × 李志</title>
<meta name="description" content="Rain & Li Zhi — 雨声混合李志，专注、平静、流动。适合编程、阅读与深夜。" />
<meta name="theme-color" content="#0b0f0e" />
<meta name="color-scheme" content="dark light" />
<script>
(function(){try{var t=localStorage.getItem('rain.theme');if(!t){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='dark';}})();
</script>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Rain" />
<link rel="preconnect" href="https://drive-cdn.1994.link" crossorigin />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<canvas id="rain-canvas" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="glow glow-a" aria-hidden="true"></div>
<div class="glow glow-b" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">雨</span>
    <span class="brand-text">RAIN <em>× 李志</em></span>
  </div>
  <div class="top-actions">
    <span id="clock" class="clock">00:00</span>
    <button id="theme-btn" class="theme-btn" aria-label="切换亮色 / 暗色">
      <svg id="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg id="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button id="install-btn" class="ghost-btn" hidden>安装 App</button>
  </div>
</header>

<main class="stage">
  <section class="hero">
    <p class="kicker">FOCUS · TRANQUILITY · FLOW</p>
    <h1 class="title">听雨<span class="dot">.</span></h1>
    <p id="quote" class="quote">“ 你离开了南京，从此没有人和我说话 ”</p>
    <p class="sub">雨声打底，人声浮上来。写代码、看书，或者什么都不做。</p>

    <div class="big-play-wrap">
      <button id="master-toggle" class="master-btn" aria-label="播放 / 暂停">
        <svg id="icon-play" viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" width="34" height="34" fill="currentColor" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <div class="big-play-hint"><span id="state-label">TAP TO BEGIN</span></div>
    </div>

    <div class="now-playing" id="now-playing" hidden>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span id="np-text">雨声 · 下雨 — 李志</span>
    </div>
  </section>

  <section class="panel">
    <div class="channel">
      <div class="channel-head">
        <h2><span class="num">01</span> 雨声</h2>
        <button class="chip is-on" id="rain-mute" aria-pressed="true">ON</button>
      </div>
      <label class="slider-row">
        <span>音量</span>
        <input id="rain-volume" type="range" min="0" max="100" value="80" />
        <b id="rain-volume-val">80</b>
      </label>
      <label class="slider-row">
        <span>雨势</span>
        <input id="rain-intensity" type="range" min="1" max="100" value="55" />
        <b id="rain-intensity-val">55</b>
      </label>
      <p class="hint">深夜大雨 · 白噪音打底，盖住键盘声和杂念。</p>
    </div>

    <div class="divider"></div>

    <div class="channel">
      <div class="channel-head">
        <h2><span class="num">02</span> 李志</h2>
        <div class="music-btns">
          <button id="prev-btn" class="icon-btn" aria-label="上一首">⏮</button>
          <button id="music-toggle" class="icon-btn" aria-label="音乐播放暂停">⏸</button>
          <button id="next-btn" class="icon-btn" aria-label="下一首">⏭</button>
        </div>
      </div>
      <label class="slider-row">
        <span>音量</span>
        <input id="music-volume" type="range" min="0" max="100" value="45" />
        <b id="music-volume-val">45</b>
      </label>
      <ol id="track-list" class="tracks"></ol>
    </div>
  </section>

  <footer class="foot">
    <p>RAIN &amp; LI ZHI — for code / reading / night.</p>
    <p class="tiny">空格 播放·暂停 · M 音乐开关 · R 雨声开关 · T 亮暗切换 · 可离线安装为 PWA</p>
  </footer>
</main>

<script src="./app.js" defer></script>
</body>
</html>
